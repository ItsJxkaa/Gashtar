<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GASH.Контроль — Инспекция кассовой дисциплины</title>
  <script src="/vendor/tailwindcss.js"></script>
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Unbounded"', 'sans-serif'],
            sans: ['"Manrope"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            forte: {
              DEFAULT: '#991B47',
              vivid: '#C81E58',
              deep: '#4A081F',
              tint: '#FAF0F3',
            },
            paper: '#EFECE6',
            card: '#F9F8F5',
            obsidian: '#111113',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #EFECE6;
      color: #111113;
      font-family: 'Manrope', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .editorial-border {
      border-color: rgba(17, 17, 19, 0.12);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(153, 27, 71, 0.5); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #C81E58; }
  </style>
</head>
<body class="min-h-screen selection:bg-forte selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEFAULT_API_KEY = "forte-datathon-2026-key";
    const MAX_VIDEOS = 10;

    function formatTimecode(sec) {
      if (sec === undefined || sec === null || isNaN(sec)) return "00:00.0";
      const totalTenths = Math.round(Math.max(0, Number(sec)) * 10);
      const mins = Math.floor(totalTenths / 600);
      const remTenths = totalTenths % 600;
      const secs = (remTenths / 10).toFixed(1);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(4, '0')}`;
    }

    function splitDescriptionAndLaw(desc = "") {
      const markers = ["Правило и нормативный источник:", "Нормативный источник:"];
      for (const marker of markers) {
        const idx = desc.indexOf(marker);
        if (idx !== -1) {
          return {
            observation: desc.slice(0, idx).trim(),
            law: desc.slice(idx + marker.length).trim()
          };
        }
      }
      return {
        observation: desc,
        law: "Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231 «Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня РК» (adilet.zan.kz)"
      };
    }

    function ForteMark({ className = "w-9 h-9" }) {
      return (
        <svg viewBox="0 0 64 64" fill="none" className={className}>
          <path
            d="M10 34C10 20.745 20.745 10 34 10H54V20H34C26.268 20 20 26.268 20 34H10Z"
            fill="currentColor"
          />
          <path
            d="M10 54C10 40.745 20.745 30 34 30H48V40H34C26.268 40 20 46.268 20 54H10Z"
            fill="currentColor"
          />
        </svg>
      );
    }

    function App() {
      /**
       * Очередь до 10 видеозаписей:
       * каждый элемент: {
       *   id: string,
       *   file: File,
       *   name: string,
       *   sizeMB: string,
       *   videoUrl: string,
       *   status: 'idle' | 'uploading' | 'processing' | 'done' | 'failed',
       *   jobId: string | null,
       *   elapsedSec: number,
       *   result: object | null,
       *   errorMsg: string | null
       * }
       */
      const [queue, setQueue] = useState([]);
      const [activeId, setActiveId] = useState(null);
      const [limitNotice, setLimitNotice] = useState(null);

      // Состояния видеоплеера для текущего выбранного видео
      const [videoDuration, setVideoDuration] = useState(30);
      const [currentTime, setCurrentTime] = useState(0);
      const [playbackSpeed, setPlaybackSpeed] = useState(1.0);
      const [activeViolationIdx, setActiveViolationIdx] = useState(0);
      const [lightboxFrame, setLightboxFrame] = useState(null);

      const videoRef = useRef(null);
      const fileInputRef = useRef(null);
      const pollTimersRef = useRef({});
      const clockTimersRef = useRef({});

      useEffect(() => {
        return () => {
          Object.values(pollTimersRef.current).forEach(clearInterval);
          Object.values(clockTimersRef.current).forEach(clearInterval);
        };
      }, []);

      useEffect(() => {
        if (!lightboxFrame) return;
        const onKeyDown = (e) => {
          if (e.key === "Escape") setLightboxFrame(null);
        };
        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, [lightboxFrame]);

      const activeItem = queue.find((item) => item.id === activeId) || queue[0] || null;

      // При переключении между видео в левом списке сбрасываем индекс нарушения и применяем скорость
      useEffect(() => {
        setActiveViolationIdx(0);
        setCurrentTime(0);
        if (videoRef.current) {
          videoRef.current.playbackRate = playbackSpeed;
        }
      }, [activeItem?.id]);

      const updateQueueItem = (id, patch) => {
        setQueue((prev) =>
          prev.map((item) => (item.id === id ? { ...item, ...(typeof patch === "function" ? patch(item) : patch) } : item))
        );
      };

      const handleFilesAdded = (fileList) => {
        if (!fileList || fileList.length === 0) return;
        const incoming = Array.from(fileList);

        setQueue((prev) => {
          const availableSlots = MAX_VIDEOS - prev.length;
          if (availableSlots <= 0) {
            setLimitNotice(`Достигнут максимум: ${MAX_VIDEOS} видео за один сеанс.`);
            setTimeout(() => setLimitNotice(null), 4000);
            return prev;
          }

          if (incoming.length > availableSlots) {
            setLimitNotice(`Добавлено ${availableSlots} из ${incoming.length} файлов (максимум ${MAX_VIDEOS} видео).`);
            setTimeout(() => setLimitNotice(null), 4000);
          } else {
            setLimitNotice(null);
          }

          const toAdd = incoming.slice(0, availableSlots).map((file, idx) => ({
            id: `${Date.now()}_${idx}_${Math.random().toString(36).slice(2, 6)}`,
            file,
            name: file.name,
            sizeMB: (file.size / (1024 * 1024)).toFixed(2),
            videoUrl: URL.createObjectURL(file),
            status: "idle",
            jobId: null,
            elapsedSec: 0,
            result: null,
            errorMsg: null,
          }));

          const nextQueue = [...prev, ...toAdd];
          if (toAdd.length > 0 && (!activeId || prev.length === 0)) {
            setActiveId(toAdd[0].id);
          }
          return nextQueue;
        });

        if (fileInputRef.current) {
          fileInputRef.current.value = "";
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          handleFilesAdded(e.dataTransfer.files);
        }
      };

      const startPollingForItem = (itemId, jobId) => {
        clearInterval(clockTimersRef.current[itemId]);
        clockTimersRef.current[itemId] = setInterval(() => {
          updateQueueItem(itemId, (it) => ({ elapsedSec: (it.elapsedSec || 0) + 1 }));
        }, 1000);

        clearInterval(pollTimersRef.current[itemId]);
        pollTimersRef.current[itemId] = setInterval(async () => {
          try {
            const res = await fetch(`/api/v1/jobs/${jobId}`, {
              headers: { "X-API-Key": DEFAULT_API_KEY }
            });
            if (!res.ok) throw new Error(`Ошибка HTTP ${res.status}`);
            const data = await res.json();

            if (data.status === "done") {
              clearInterval(pollTimersRef.current[itemId]);
              clearInterval(clockTimersRef.current[itemId]);
              updateQueueItem(itemId, { status: "done", result: data });
            } else if (data.status === "failed") {
              clearInterval(pollTimersRef.current[itemId]);
              clearInterval(clockTimersRef.current[itemId]);
              updateQueueItem(itemId, {
                status: "failed",
                errorMsg: data.error || "Ошибка анализа видеозаписи"
              });
            }
          } catch (err) {
            clearInterval(pollTimersRef.current[itemId]);
            clearInterval(clockTimersRef.current[itemId]);
            updateQueueItem(itemId, { status: "failed", errorMsg: err.message });
          }
        }, 1200);
      };

      const analyzeSingleItem = async (item) => {
        if (!item || item.status === "uploading" || item.status === "processing") return;
        updateQueueItem(item.id, {
          status: "uploading",
          errorMsg: null,
          result: null,
          elapsedSec: 0,
        });

        try {
          const formData = new FormData();
          formData.append("file", item.file);

          const res = await fetch("/api/v1/analyze", {
            method: "POST",
            headers: { "X-API-Key": DEFAULT_API_KEY },
            body: formData
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.detail || `Ошибка сервера (${res.status})`);
          }

          const data = await res.json();
          updateQueueItem(item.id, {
            jobId: data.job_id,
            status: "processing",
          });
          startPollingForItem(item.id, data.job_id);
        } catch (err) {
          updateQueueItem(item.id, {
            status: "failed",
            errorMsg: err.message,
          });
        }
      };

      const handleAnalyzeAllPending = () => {
        const pending = queue.filter((it) => it.status === "idle" || it.status === "failed");
        pending.forEach((it) => analyzeSingleItem(it));
      };

      const removeQueueItem = (e, id) => {
        e.stopPropagation();
        clearInterval(pollTimersRef.current[id]);
        clearInterval(clockTimersRef.current[id]);
        setQueue((prev) => {
          const target = prev.find((item) => item.id === id);
          if (target?.videoUrl) {
            URL.revokeObjectURL(target.videoUrl);
          }
          const next = prev.filter((item) => item.id !== id);
          if (activeId === id) {
            setActiveId(next[0]?.id || null);
          }
          return next;
        });
      };

      const clearAllQueue = () => {
        Object.values(pollTimersRef.current).forEach(clearInterval);
        Object.values(clockTimersRef.current).forEach(clearInterval);
        queue.forEach((item) => {
          if (item?.videoUrl) URL.revokeObjectURL(item.videoUrl);
        });
        setQueue([]);
        setActiveId(null);
        setLimitNotice(null);
        setPlaybackSpeed(1.0);
      };

      const seekToSeconds = (sec, violationIndex = null) => {
        if (violationIndex !== null) {
          setActiveViolationIdx(violationIndex);
        }
        if (videoRef.current) {
          const clamped = Math.max(0, Math.min(sec, videoDuration || 9999));
          videoRef.current.currentTime = clamped;
          videoRef.current.pause();
          setCurrentTime(clamped);
        }
      };

      const changeSpeed = (rate) => {
        setPlaybackSpeed(rate);
        if (videoRef.current) {
          videoRef.current.playbackRate = rate;
        }
      };

      const getFrameSrc = (base64Str) => {
        if (!base64Str) return "";
        return base64Str.startsWith("data:") ? base64Str : `data:image/jpeg;base64,${base64Str}`;
      };

      // Статистика по очереди из до 10 видео
      const doneCount = queue.filter((i) => i.status === "done").length;
      const busyCount = queue.filter((i) => i.status === "uploading" || i.status === "processing").length;
      const idleCount = queue.filter((i) => i.status === "idle" || i.status === "failed").length;

      // Генерация спектра событий для активного видео
      const activeResult = activeItem?.result || null;
      const waveformBars = Array.from({ length: 48 }, (_, i) => {
        const barTime = ((i + 0.5) / 48) * (videoDuration || 30);
        const nearViolation = (activeResult?.violations || []).some(
          (v) => Math.abs(v.timecode_sec - barTime) <= Math.max(0.8, (videoDuration || 30) * 0.03)
        );
        const heightPct = nearViolation ? 95 : 22 + ((i * 19) % 45);
        return { heightPct, nearViolation, barTime };
      });

      return (
        <div className="min-h-screen flex flex-col lg:flex-row">
          {/* Скрытый мульти-инпут для загрузки до 10 видео за раз */}
          <input
            ref={fileInputRef}
            type="file"
            multiple
            accept=".mov,.mp4,video/*"
            className="hidden"
            onChange={(e) => handleFilesAdded(e.target.files)}
          />

          {/* ЛЕВЫЙ ЧЕРНЫЙ ПУЛЬТ: УПРАВЛЕНИЕ + ОЧЕРЕДЬ ДО 10 ВИДЕО С ПРОГРЕССОМ И ПЕРЕКЛЮЧЕНИЕМ */}
          <aside className="w-full lg:w-80 xl:w-[340px] bg-obsidian text-white flex flex-col justify-between p-5 lg:p-6 shrink-0 lg:min-h-screen lg:sticky lg:top-0 lg:h-screen border-b lg:border-b-0 lg:border-r border-white/10">
            <div className="flex flex-col min-h-0 flex-1">
              {/* 1. Фирменный логотип Forte */}
              <div className="flex items-center justify-between pb-4 border-b border-white/10 shrink-0">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-2xl bg-forte flex items-center justify-center text-white shadow-lg shadow-forte/40">
                    <ForteMark className="w-6 h-6" />
                  </div>
                  <div>
                    <div className="font-display font-bold text-base tracking-tight text-white">
                      GASH<span className="text-forte-vivid">.</span>Контроль
                    </div>
                    <div className="font-mono text-[10px] uppercase tracking-widest text-neutral-400">
                      Видеоинспекция кассы
                    </div>
                  </div>
                </div>

                {/* Счетчик слотов X / 10 */}
                <div className="px-2.5 py-1 rounded-lg bg-white/[0.06] border border-white/10 font-mono text-xs font-bold">
                  <span className={queue.length >= MAX_VIDEOS ? "text-forte-vivid" : "text-white"}>
                    {queue.length}
                  </span>
                  <span className="text-neutral-500">/{MAX_VIDEOS}</span>
                </div>
              </div>

              {/* 2. Кнопки добавления видео и запуска пакетной проверки */}
              <div className="mt-4 space-y-2 shrink-0">
                <div className="flex gap-2">
                  <button
                    onClick={() => fileInputRef.current?.click()}
                    disabled={queue.length >= MAX_VIDEOS}
                    className={`flex-1 px-3.5 py-2.5 rounded-xl border text-left transition flex items-center justify-between ${
                      queue.length >= MAX_VIDEOS
                        ? "bg-white/[0.03] border-white/5 text-neutral-500 cursor-not-allowed"
                        : "bg-white/[0.07] hover:bg-white/[0.12] border-white/10 text-white cursor-pointer"
                    }`}
                  >
                    <span className="text-xs font-bold">
                      + Добавить видео (до 10)
                    </span>
                    <span className="font-mono text-xs text-forte-vivid font-bold">↑</span>
                  </button>

                  {queue.length > 0 && (
                    <button
                      onClick={clearAllQueue}
                      title="Очистить весь список"
                      className="px-3 py-2.5 rounded-xl bg-white/[0.05] hover:bg-rose-950/80 border border-white/10 hover:border-forte text-neutral-400 hover:text-white text-xs font-mono transition cursor-pointer"
                    >
                      Очистить
                    </button>
                  )}
                </div>

                {idleCount > 0 && (
                  <button
                    onClick={handleAnalyzeAllPending}
                    className="w-full px-4 py-3 rounded-xl bg-forte hover:bg-forte-vivid text-white font-display text-xs font-bold uppercase tracking-wider shadow-lg shadow-forte/30 transition cursor-pointer flex items-center justify-between"
                  >
                    <span>
                      {idleCount === 1 ? "Запустить анализ (1)" : `Проверить все видео (${idleCount})`}
                    </span>
                    <span>→</span>
                  </button>
                )}

                {limitNotice && (
                  <div className="p-2.5 rounded-xl bg-forte/20 border border-forte-vivid/40 text-[11px] text-rose-200 font-medium">
                    {limitNotice}
                  </div>
                )}
              </div>

              {/* 3. СПИСОК ЗАГРУЖЕННЫХ ВИДЕО (ОЧЕРЕДЬ ДО 10 ШТ.) С ПРОГРЕССОМ И ПЕРЕХОДОМ К РЕЗУЛЬТАТАМ */}
              <div className="mt-5 pt-4 border-t border-white/10 flex-1 flex flex-col min-h-0">
                <div className="flex items-center justify-between font-mono text-[10px] uppercase tracking-widest text-neutral-400 mb-2.5 shrink-0">
                  <span>ОЧЕРЕДЬ ПРОВЕРКИ ВИДЕО</span>
                  <span>
                    Готово: <strong className="text-white">{doneCount}/{queue.length}</strong>
                  </span>
                </div>

                {/* Общий прогресс-бар пакета */}
                {queue.length > 0 && (
                  <div className="h-1.5 w-full bg-white/10 rounded-full overflow-hidden mb-3 shrink-0">
                    <div
                      className="h-full bg-gradient-to-r from-forte to-emerald-400 transition-all duration-300"
                      style={{
                        width: `${Math.round(((doneCount + busyCount * 0.4) / Math.max(queue.length, 1)) * 100)}%`
                      }}
                    />
                  </div>
                )}

                {/* Прокручиваемый список из 1..10 видео */}
                {queue.length === 0 ? (
                  <div
                    onClick={() => fileInputRef.current?.click()}
                    className="flex-1 rounded-2xl border border-dashed border-white/10 hover:border-forte/60 bg-white/[0.02] hover:bg-white/[0.04] transition p-5 flex flex-col items-center justify-center text-center cursor-pointer"
                  >
                    <div className="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-neutral-400 mb-2 font-mono text-sm">
                      0/10
                    </div>
                    <div className="text-xs font-bold text-neutral-300">
                      Список видео пуст
                    </div>
                    <p className="text-[11px] text-neutral-500 mt-1 leading-relaxed">
                      Загрузите от 1 до 10 файлов <code className="text-neutral-300">.mov</code>, чтобы отслеживать их прогресс и переключаться между результатами
                    </p>
                  </div>
                ) : (
                  <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                    {queue.map((item, idx) => {
                      const isSelected = activeItem?.id === item.id;
                      const violationsCount = item.result?.violations?.length || 0;

                      return (
                        <div
                          key={item.id}
                          onClick={() => setActiveId(item.id)}
                          className={`group relative rounded-2xl p-3 transition-all cursor-pointer border ${
                            isSelected
                              ? "bg-white/[0.12] border-forte-vivid shadow-md"
                              : "bg-white/[0.03] hover:bg-white/[0.07] border-white/5"
                          }`}
                        >
                          <div className="flex items-start justify-between gap-2">
                            <div className="flex items-center space-x-2.5 min-w-0">
                              <span
                                className={`w-6 h-6 rounded-lg font-mono text-[11px] font-bold flex items-center justify-center shrink-0 ${
                                  isSelected
                                    ? "bg-forte text-white"
                                    : "bg-white/10 text-neutral-400"
                                }`}
                              >
                                {String(idx + 1).padStart(2, "0")}
                              </span>
                              <div className="min-w-0">
                                <div className="text-xs font-bold text-white truncate">
                                  {item.name}
                                </div>
                                <div className="font-mono text-[10px] text-neutral-400">
                                  {item.sizeMB} МБ
                                </div>
                              </div>
                            </div>

                            {/* Кнопка удаления одного видео из списка */}
                            <button
                              onClick={(e) => removeQueueItem(e, item.id)}
                              title="Убрать из списка"
                              className="w-5 h-5 rounded-full hover:bg-white/20 text-neutral-500 hover:text-white flex items-center justify-center text-[10px] shrink-0 transition"
                            >
                              ✕
                            </button>
                          </div>

                          {/* Нижняя строка карточки в очереди: Статус / Прогресс / Вердикт */}
                          <div className="mt-2.5 pt-2 border-t border-white/5 flex items-center justify-between text-[11px]">
                            {item.status === "idle" && (
                              <>
                                <span className="font-mono text-neutral-400">Ожидает запуска</span>
                                <button
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    setActiveId(item.id);
                                    analyzeSingleItem(item);
                                  }}
                                  className="px-2 py-0.5 rounded bg-forte/80 hover:bg-forte text-white font-mono text-[10px] font-bold transition"
                                >
                                  ▶ Проверить
                                </button>
                              </>
                            )}

                            {(item.status === "uploading" || item.status === "processing") && (
                              <div className="w-full flex items-center justify-between font-mono text-amber-300">
                                <span className="flex items-center space-x-1.5">
                                  <span className="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
                                  <span>{item.status === "uploading" ? "Загрузка..." : "Анализ..."}</span>
                                </span>
                                <span>{item.elapsedSec} сек</span>
                              </div>
                            )}

                            {item.status === "done" && item.result && (
                              <div className="w-full flex items-center justify-between">
                                {item.result.verdict === "violation" ? (
                                  <span className="px-2 py-0.5 rounded-md bg-forte-vivid/25 border border-forte-vivid/50 text-rose-200 font-mono text-[10px] font-bold">
                                    ! Нарушений: {violationsCount}
                                  </span>
                                ) : (
                                  <span className="px-2 py-0.5 rounded-md bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 font-mono text-[10px] font-bold">
                                    ✓ Нарушений нет
                                  </span>
                                )}
                                <span className="font-mono text-[10px] text-neutral-400 group-hover:text-white">
                                  Открыть →
                                </span>
                              </div>
                            )}

                            {item.status === "failed" && (
                              <div className="w-full flex items-center justify-between text-rose-400 font-mono text-[10px]">
                                <span>✕ Ошибка</span>
                                <button
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    analyzeSingleItem(item);
                                  }}
                                  className="underline hover:text-white"
                                >
                                  Повторить
                                </button>
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

                            );
                          })}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* Нижний колонтитул */}
            <footer className="max-w-6xl w-full mx-auto pt-8 mt-10 border-t editorial-border flex flex-col sm:flex-row items-center justify-between gap-2 font-mono text-[11px] text-neutral-500">
              <span>GASH.КОНТРОЛЬ // FORTEBANK DATATHON 26 · AI CASH COMPLIANCE</span>
              <span>ЛОКАЛЬНОЕ ИСПОЛНЕНИЕ БЕЗ ОБЛАЧНЫХ СЕРВИСОВ</span>
            </footer>
          </main>

          {/* МОДАЛЬНОЕ ОКНО ПРОСМОТРА КАДРА-ДОКАЗАТЕЛЬСТВА */}
          {lightboxFrame && (
            <div
              onClick={() => setLightboxFrame(null)}
              className="fixed inset-0 z-50 bg-obsidian/85 backdrop-blur-sm flex items-center justify-center p-4"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="bg-card rounded-[28px] max-w-4xl w-full overflow-hidden shadow-2xl border border-white/15"
              >
                <div className="px-6 py-4 bg-obsidian text-white flex items-center justify-between gap-4">
                  <div className="flex items-center space-x-3 min-w-0">
                    <span className="px-3 py-1 rounded-full bg-forte font-mono text-xs font-bold shrink-0">
                      {lightboxFrame.timestamp} сек
                    </span>
                    <span className="font-display text-xs sm:text-sm font-bold truncate">
                      {lightboxFrame.type}
                    </span>
                  </div>
                  <button
                    onClick={() => setLightboxFrame(null)}
                    aria-label="Закрыть"
                    className="w-8 h-8 rounded-full bg-white/10 hover:bg-forte text-neutral-300 hover:text-white flex items-center justify-center transition cursor-pointer shrink-0 text-sm font-bold"
                  >
                    ✕
                  </button>
                </div>
                <div className="bg-black flex items-center justify-center max-h-[75vh]">
                  <img
                    src={lightboxFrame.src}
                    alt="Кадр-доказательство"
                    className="max-h-[75vh] w-auto object-contain"
                  />
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
